name: PR Security Scan Trigger

on:
  pull_request:
    branches:
      - develop

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show changed files (for external agent)
        run: |
          echo "Changed files in PR:"
          git diff --name-only origin/develop...HEAD

      - name: Send payload to external agent (placeholder)
        run: |
          echo "Triggering external security agent..."
          echo "PR ready for analysis"